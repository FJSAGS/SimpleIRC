plugins {
	id 'net.fabricmc.fabric-loom' version "1.16-SNAPSHOT"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
	maven {
        url 'https://jitpack.io'
    }
    maven {
        url "https://maven.terraformersmc.com/"
    }
	maven { 
		url "https://maven.terraformersmc.com/releases/" 
	}
    maven {
        url "https://maven.shedaniel.me/"
    }
    maven {
      url "https://maven.siphalor.de/"
    }
	maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
	maven {
        url "https://maven.isxander.dev/releases"
    }
	maven {
        url "https://maven.quiltmc.org/repository/release"
    }
    maven {
        url 'https://maven.wispforest.io/releases'
    }

}

loom {

	mods {
		"simpleirc" {
			sourceSet sourceSets.main}
        "fabric-automessage" {
            sourceSet sourceSets.main
        }
	}


}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Uncomment the following line to enable the deprecated Fabric API modules.
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
	
	//
    include api("net.fabricmc:mapping-io:${project.mapping_io_version}")
    //modApi("me.shedaniel.cloth:cloth-config-fabric:19.0.147") {
    //    exclude(group: "net.fabricmc.fabric-api")
    //}

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

	// Replace Tag with the current version you can find at the top of this page
   // modImplementation include("net.kyori:adventure-platform-fabric:6.6.0")
  //  modImplementation "net.kyori:adventure-text-minimessage:4.25.0"
    implementation "io.wispforest:owo-lib:${project.owo_version}"
    include "io.wispforest:owo-sentinel:${project.owo_version}"
    annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"
	implementation(include("net.kyori:adventure-platform-fabric:6.9.0"))
	implementation("net.kyori:adventure-text-minimessage:4.26.1")

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
